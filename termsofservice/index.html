<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>BodyBuddy – תנאי שימוש</title>
  <link rel="icon" type="image/svg+xml" href="../privecypolicy/favicon.svg" />
  <link rel="icon" type="image/png" href="../privecypolicy/favicon.png" />
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    [hidden] { display: none !important; }

    :root {
      --bg:       #1a2030;
      --surface:  #252d3a;
      --inner:    #2c3545;
      --green:    #96C828;
      --muted:    #516070;
      --text:     #c8d0db;
      --heading:  #ffffff;
      --radius:   16px;
    }

    html { scroll-behavior: smooth; }

    body {
      background: var(--bg);
      color: var(--text);
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      line-height: 1.7;
      min-height: 100vh;
    }

    /* ───── SPLASH ───── */
    #splash {
      position: fixed;
      inset: 0;
      z-index: 100;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      background: var(--bg);
      gap: 24px;
      transition: opacity 0.6s ease, visibility 0.6s ease;
    }
    #splash.hidden { opacity: 0; visibility: hidden; }

    .splash-subtitle {
      color: var(--muted);
      font-size: 0.95rem;
      letter-spacing: 0.18em;
      text-transform: uppercase;
      opacity: 0;
      animation: fade-in 0.4s ease 0.97s forwards;
    }

    /* ───── STICKY HEADER ───── */
    header {
      position: sticky;
      top: 0;
      z-index: 50;
      direction: ltr;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 16px;
      padding: 10px 24px;
      background: rgba(26, 32, 48, 0.92);
      backdrop-filter: blur(14px);
      -webkit-backdrop-filter: blur(14px);
      border-bottom: 1px solid rgba(150, 200, 40, 0.15);
    }
    .header-label {
      font-size: 0.8rem;
      letter-spacing: 0.14em;
      text-transform: uppercase;
      color: var(--muted);
      flex: 1;
    }

    /* ───── LANGUAGE TOGGLE ───── */
    .lang-toggle {
      display: flex;
      border-radius: 999px;
      border: 1px solid rgba(255,255,255,0.12);
      background: rgba(255,255,255,0.05);
      overflow: hidden;
      flex-shrink: 0;
    }
    .lang-toggle button {
      appearance: none;
      border: none;
      background: transparent;
      color: var(--muted);
      font-size: 0.78rem;
      font-weight: 700;
      letter-spacing: 0.06em;
      padding: 6px 14px;
      cursor: pointer;
      transition: background 0.15s, color 0.15s;
    }
    .lang-toggle button.active {
      background: rgba(150, 200, 40, 0.2);
      color: var(--green);
    }
    .lang-toggle button:hover:not(.active) {
      color: var(--text);
    }

    /* ───── DOCUMENT TOGGLE ───── */
    .doc-toggle {
      display: flex;
      justify-content: center;
      width: fit-content;
      margin: 20px auto 24px;
      border-radius: 999px;
      border: 1px solid rgba(255,255,255,0.12);
      background: rgba(255,255,255,0.05);
      overflow: hidden;
    }
    .doc-toggle button {
      appearance: none;
      border: none;
      background: transparent;
      color: var(--muted);
      font-size: 0.85rem;
      font-weight: 700;
      padding: 8px 20px;
      cursor: pointer;
      transition: background 0.15s, color 0.15s;
    }
    .doc-toggle button.active {
      background: rgba(150, 200, 40, 0.2);
      color: var(--green);
    }
    .doc-toggle button:hover:not(.active) {
      color: var(--text);
    }

    /* ───── MAIN ───── */
    main {
      max-width: 740px;
      margin: 0 auto;
      padding: 40px 20px 80px;
    }

    /* ───── HERO INSIDE MAIN ───── */
    .page-hero {
      text-align: center;
      margin-bottom: 48px;
    }
    .page-hero h1 {
      font-size: clamp(1.8rem, 5vw, 2.6rem);
      color: var(--heading);
      font-weight: 700;
      margin-bottom: 8px;
    }
    .page-hero h1 span { color: var(--green); }
    .date-badge {
      display: inline-block;
      background: rgba(150, 200, 40, 0.15);
      color: var(--green);
      border: 1px solid rgba(150, 200, 40, 0.35);
      border-radius: 999px;
      padding: 4px 16px;
      font-size: 0.78rem;
      letter-spacing: 0.02em;
      margin-top: 12px;
    }

    /* ───── CARDS ───── */
    .card {
      background: var(--surface);
      border-radius: var(--radius);
      padding: 28px 32px;
      margin-bottom: 20px;
      border: 1px solid rgba(255,255,255,0.04);
    }
    .card h2 {
      color: var(--heading);
      font-size: 1.05rem;
      font-weight: 700;
      margin-bottom: 16px;
      display: flex;
      align-items: center;
      gap: 10px;
    }
    .card h2::after {
      content: '';
      flex: 1;
      height: 2px;
      background: linear-gradient(90deg, var(--green) 0%, transparent 100%);
      border-radius: 999px;
    }
    [dir="rtl"] .card h2::after {
      background: linear-gradient(270deg, var(--green) 0%, transparent 100%);
    }
    .section-number {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      flex-shrink: 0;
      width: 24px;
      height: 24px;
      border-radius: 999px;
      background: rgba(150, 200, 40, 0.15);
      border: 1px solid rgba(150, 200, 40, 0.4);
      color: var(--green);
      font-size: 0.78rem;
      font-weight: 700;
    }
    .card p { margin-bottom: 12px; }
    .card p:last-child { margin-bottom: 0; }
    .card ul {
      padding-inline-start: 20px;
      margin: 10px 0;
      display: flex;
      flex-direction: column;
      gap: 6px;
    }
    .card ul li::marker { color: var(--green); }

    a {
      color: var(--green);
      text-decoration: none;
    }
    a:hover { text-decoration: underline; }

    .contact-btn {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      margin-top: 14px;
      background: rgba(150, 200, 40, 0.12);
      border: 1px solid rgba(150, 200, 40, 0.4);
      border-radius: 999px;
      padding: 8px 22px;
      color: var(--green);
      font-size: 0.9rem;
      font-weight: 600;
      transition: background 0.2s;
    }
    .contact-btn:hover {
      background: rgba(150, 200, 40, 0.22);
      text-decoration: none;
    }
    .contact-btn svg { flex-shrink: 0; }

    /* ───── WHAT'S NEW ───── */
    .changes-card {
      background: rgba(150, 200, 40, 0.08);
      border: 1px solid rgba(150, 200, 40, 0.35);
      border-radius: var(--radius);
      padding: 24px 28px;
      margin-bottom: 32px;
    }
    .changes-card h2 {
      color: var(--green);
      font-size: 1rem;
      font-weight: 700;
      margin-bottom: 12px;
      display: flex;
      align-items: center;
      gap: 8px;
    }
    .changes-card h2 svg { flex-shrink: 0; }
    .changes-card ul {
      padding-inline-start: 20px;
      margin: 0;
      display: flex;
      flex-direction: column;
      gap: 6px;
    }
    .changes-card ul li::marker { color: var(--green); }
    .changes-card ul li { color: var(--text); font-size: 0.92rem; }

    footer {
      text-align: center;
      padding: 32px 20px;
      color: var(--muted);
      font-size: 0.78rem;
    }

    /* ───── BACK TO TOP ───── */
    .back-to-top {
      position: fixed;
      right: 24px;
      bottom: 24px;
      z-index: 60;
      width: 48px;
      height: 48px;
      border-radius: 999px;
      background: rgba(150, 200, 40, 0.18);
      border: 1px solid rgba(150, 200, 40, 0.45);
      color: var(--green);
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      opacity: 0;
      visibility: hidden;
      transform: translateY(8px);
      transition: opacity 0.2s ease, transform 0.2s ease, visibility 0.2s, background 0.15s;
    }
    .back-to-top.visible {
      opacity: 1;
      visibility: visible;
      transform: translateY(0);
    }
    .back-to-top:hover {
      background: rgba(150, 200, 40, 0.28);
    }
    @media (max-width: 500px) {
      .back-to-top { right: 16px; bottom: 16px; width: 44px; height: 44px; }
    }

    /* ───── LOADING ───── */
    .loading-wrap {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 16px;
      padding: 60px 20px;
      color: var(--muted);
      font-size: 0.9rem;
    }
    /* ───── BODYBUDDY LOADING ICON (elastic trail spin) ───── */
    .bb-loading-icon {
      position: relative;
      width: 56px;
      height: 56px;
    }
    .bb-loading-icon svg {
      position: absolute;
      inset: 0;
      width: 100%;
      height: 100%;
    }
    .bb-loading-main {
      animation: bb-spin 1.3s cubic-bezier(0.34, 1.56, 0.64, 1) infinite;
    }
    .bb-loading-ghost1 {
      opacity: 0.16;
      animation: bb-spin 1.3s cubic-bezier(0.34, 1.56, 0.64, 1) infinite;
      animation-delay: -90ms;
    }
    .bb-loading-ghost2 {
      opacity: 0.07;
      animation: bb-spin 1.3s cubic-bezier(0.34, 1.56, 0.64, 1) infinite;
      animation-delay: -170ms;
    }
    @keyframes bb-spin {
      to { transform: rotate(360deg); }
    }

    /* ───── ERROR ───── */
    .error-wrap {
      display: flex;
      flex-direction: column;
      align-items: center;
      text-align: center;
      gap: 16px;
      padding: 48px 20px;
    }
    .retry-btn {
      appearance: none;
      border: 1px solid rgba(255,255,255,0.16);
      background: rgba(255,255,255,0.05);
      color: var(--text);
      border-radius: 999px;
      padding: 8px 22px;
      font-size: 0.85rem;
      cursor: pointer;
    }
    .retry-btn:hover { background: rgba(255,255,255,0.1); }

    /* ───── LOGO SVG ANIMATIONS ───── */
    @keyframes slide-left {
      from { opacity: 0; transform: translateX(-40px); }
      to   { opacity: 1; transform: translateX(0); }
    }
    @keyframes slide-right {
      from { opacity: 0; transform: translateX(40px); }
      to   { opacity: 1; transform: translateX(0); }
    }
    @keyframes scale-in {
      from { opacity: 0; transform: scale(0.3); }
      to   { opacity: 1; transform: scale(1); }
    }
    @keyframes slide-up {
      from { opacity: 0; transform: translateY(20px); }
      to   { opacity: 1; transform: translateY(0); }
    }
    @keyframes fade-in {
      from { opacity: 0; }
      to   { opacity: 1; }
    }

    /* Each group starts invisible and animates in */
    .logo-left-b,
    .logo-right-b,
    .logo-upper-conn,
    .logo-lower-conn,
    .logo-text {
      opacity: 0;
    }
    .logo-left-b {
      animation: slide-left 0.4s cubic-bezier(.4,0,.2,1) 0ms forwards;
    }
    .logo-right-b {
      animation: slide-right 0.4s cubic-bezier(.4,0,.2,1) 150ms forwards;
    }
    .logo-upper-conn {
      transform-box: fill-box;
      transform-origin: center;
      animation: scale-in 0.35s cubic-bezier(.34,1.56,.64,1) 300ms forwards;
    }
    .logo-lower-conn {
      transform-box: fill-box;
      transform-origin: center;
      animation: scale-in 0.35s cubic-bezier(.34,1.56,.64,1) 420ms forwards;
    }
    .logo-text {
      transform-box: fill-box;
      transform-origin: center;
      animation: slide-up 0.4s cubic-bezier(.4,0,.2,1) 570ms forwards;
    }

    /* Small header logo – no animation replay */
    .header-logo .logo-left-b,
    .header-logo .logo-right-b,
    .header-logo .logo-upper-conn,
    .header-logo .logo-lower-conn,
    .header-logo .logo-text {
      opacity: 1;
      animation: none;
    }

    @media (max-width: 500px) {
      .card { padding: 20px 18px; }
      header { padding: 8px 16px; }
    }
  </style>
</head>
